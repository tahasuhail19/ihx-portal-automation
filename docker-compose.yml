services:
  ihxflow:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ipc: host
    shm_size: "2gb"
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6080:6080"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      DISPLAY: ":99"
      STATIC_DIR: "/app/frontend/dist"
      NOVNC_WEB: "/opt/noVNC"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
      VIEWER_URL: "http://127.0.0.1:6080/vnc.html?autoconnect=1&resize=scale&reconnect=1&path=websockify"
      SESSION_TIMEOUT_MS: "1800000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
